<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F6F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>collectobjects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "@imgly/background-removal": "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/background-removal.js"
    }
  }
  </script>
  <style>
    /* ── Tokens ─────────────────────────────────────────────────── */
    :root {
      --neutral-0:    #FFFFFF;
      --neutral-50:   #F6F6F6;
      --neutral-100:  #E2E2E2;
      --neutral-200:  #D4D4D4;
      --neutral-300:  #C0C0C0;
      --neutral-400:  #B4B4B4;
      --neutral-500:  #A1A1A1;
      --neutral-600:  #939393;
      --neutral-700:  #727272;
      --neutral-800:  #595959;
      --neutral-900:  #444444;
      --neutral-1000: #141414;

      --orange-accent:      #f5a742;
      --orange-accent-dark: #e8962e;
      --orange-accent-glow: rgba(245,167,66,0.30);

      --color-bg:             var(--neutral-50);
      --color-dot:            var(--neutral-100);
      --color-surface:        var(--neutral-100);
      --color-white:          var(--neutral-0);
      --color-text-primary:   var(--neutral-1000);
      --color-text-secondary: var(--neutral-600);
      --color-text-tertiary:  var(--neutral-400);
      --color-accent:         var(--orange-accent);
      --color-accent-dark:    var(--orange-accent-dark);
      --color-accent-glow:    var(--orange-accent-glow);
      --color-camera-bg:      var(--neutral-1000);
      --color-border:         var(--neutral-200);
      --color-border-subtle:  var(--neutral-100);

      --font-ui:     -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      --font-object: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;

      --fs-xs:   11px;
      --fs-sm:   13px;
      --fs-base: 14px;
      --fs-md:   15px;
      --fs-lg:   18px;
      --fs-xl:   22px;
      --fs-2xl:  28px;

      --fw-reg:   400;
      --fw-med:   500;
      --fw-semi:  600;
      --fw-bold:  700;
      --fw-black: 800;

      --sp-xs:  4px;
      --sp-sm:  8px;
      --sp-md:  12px;
      --sp-lg:  16px;
      --sp-xl:  20px;
      --sp-2xl: 24px;
      --sp-3xl: 32px;
      --sp-4xl: 48px;

      --r-sm:   12px;
      --r-md:   20px;
      --r-pill: 100px;
      --r-full: 50%;

      --sh-object:    drop-shadow(0 6px 18px rgba(0,0,0,0.14));
      --sh-object-lg: drop-shadow(0 8px 22px rgba(0,0,0,0.16));
      --sh-fab:       0 6px 20px rgba(245,167,66,0.35);
      --sh-close:     0 1px 6px rgba(0,0,0,0.12);

      --tx-fast: 0.15s ease;
      --tx-base: 0.2s ease;
      --tx-slow: 0.3s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-ui);
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      overflow: hidden;
      max-width: 430px;
      margin: 0 auto;
      position: relative;
    }

    /* ═══════════════════════════════════════
       HOME / GRID
    ═══════════════════════════════════════ */
    #home {
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; bottom: 0;
      z-index: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding:
        calc(var(--sp-2xl) + env(safe-area-inset-top,    0px))
        calc(var(--sp-lg)  + env(safe-area-inset-right,  0px))
        calc(90px          + env(safe-area-inset-bottom, 0px))
        calc(var(--sp-lg)  + env(safe-area-inset-left,   0px));
      background-image: radial-gradient(circle, var(--color-dot) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .header { margin-bottom: var(--sp-3xl); }
    .header__title {
      font-family: var(--font-ui);
      font-size: var(--fs-2xl);
      font-weight: var(--fw-black);
      letter-spacing: -0.5px;
      line-height: 1.15;
    }
    .header__count {
      font-size: var(--fs-sm);
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: var(--sp-lg);
      row-gap: var(--sp-2xl);
    }

    .card {
      cursor: pointer; user-select: none;
      transition: transform var(--tx-base);
      display: flex; flex-direction: column; align-items: center;
    }
    .card:active { transform: scale(0.97); }

    .card__img-wrap {
      width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .card__img-wrap img {
      width: 90%; height: 90%;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter:
        drop-shadow( 2px  0   0 #fff)
        drop-shadow(-2px  0   0 #fff)
        drop-shadow( 0    2px 0 #fff)
        drop-shadow( 0   -2px 0 #fff)
        drop-shadow( 1.5px  1.5px 0 #fff)
        drop-shadow(-1.5px  1.5px 0 #fff)
        drop-shadow( 1.5px -1.5px 0 #fff)
        drop-shadow(-1.5px -1.5px 0 #fff)
        drop-shadow(0 6px 18px rgba(0,0,0,0.12));
    }

    .card__name {
      font-family: var(--font-object);
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
      letter-spacing: -0.2px;
      color: var(--color-text-primary);
      text-align: center;
      margin-top: var(--sp-sm);
      line-height: 1.2;
    }
    .card__date {
      font-size: var(--fs-xs);
      color: var(--color-text-tertiary);
      text-align: center;
      margin-top: 4px;
    }

    /* FAB */
    #fab {
      position: fixed;
      bottom: calc(var(--sp-2xl) + env(safe-area-inset-bottom, 0px));
      right: max(calc(var(--sp-xl) + env(safe-area-inset-right, 0px)), calc(50vw - 215px + var(--sp-xl)));
      width: 58px; height: 58px; border-radius: var(--r-full);
      background: var(--color-accent); box-shadow: var(--sh-fab);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 50; transition: transform var(--tx-fast); user-select: none;
    }
    #fab:active { transform: scale(0.95); }

    /* ═══════════════════════════════════════
       SHARED OVERLAY BASE
    ═══════════════════════════════════════ */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; height: 100%;
      z-index: 200;
    }
    .overlay.active { display: flex; }

    .btn-close {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: 16px;
      width: 44px; height: 44px; border-radius: var(--r-full);
      background: rgba(255,255,255,0.92);
      box-shadow: var(--sh-close);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--neutral-800); z-index: 10;
    }

    /* ═══════════════════════════════════════
       STEP 1 — CAMERA
    ═══════════════════════════════════════ */
    #camera-overlay {
      background: var(--color-camera-bg);
      flex-direction: column;
    }

    #camera-video { flex: 1; width: 100%; object-fit: cover; display: block; transform: scaleX(-1); }

    .cam-denied {
      display: none; flex: 1; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--neutral-600); font-size: var(--fs-sm);
      text-align: center; padding: 32px; gap: 12px;
    }
    .cam-denied.visible { display: flex; }
    .cam-denied span:first-child { font-size: 40px; }

    .cam-controls {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      padding: 24px 0 calc(36px + env(safe-area-inset-bottom, 0px));
      background: var(--color-camera-bg);
    }

    #shutter-btn {
      width: 72px; height: 72px; border-radius: var(--r-full);
      background: #fff; border: none; cursor: pointer;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.25), 0 0 0 7px rgba(255,255,255,0.1);
      transition: transform var(--tx-base), background var(--tx-base);
      outline: none;
    }
    #shutter-btn:active { transform: scale(0.91); background: #ccc; }

    /* ═══════════════════════════════════════
       STEP 2 — PROCESSING
    ═══════════════════════════════════════ */
    #processing-overlay {
      background: var(--color-bg);
      background-image: radial-gradient(circle, var(--color-dot) 1px, transparent 1px);
      background-size: 28px 28px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .cut-stage {
      position: relative;
      width: 240px; height: 240px;
    }

    .cut-stage__img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    .cut-stage__svg {
      position: absolute;
      inset: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      overflow: visible;
    }

    .cut-trace {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 8 7;
      opacity: 0.35;
      filter: drop-shadow(0 0 3px rgba(245,167,66,0.4));
    }

    .cut-done {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 942;
      stroke-dashoffset: 942;
      animation: grow-done 2.8s linear infinite;
      filter: drop-shadow(0 0 5px rgba(245,167,66,0.7));
    }
    @keyframes grow-done {
      0%   { stroke-dashoffset: 942; }
      96%  { stroke-dashoffset: 0;   }
      100% { stroke-dashoffset: 942; }
    }

    .cut-scissors {
      position: absolute;
      font-size: 22px;
      line-height: 1;
      offset-path: path('M22,12 L222,12 Q234,12 234,24 L234,222 Q234,234 222,234 L22,234 Q12,234 12,222 L12,24 Q12,12 22,12 Z');
      offset-distance: 0%;
      offset-rotate: auto;
      animation: scissors-ride 2.8s linear infinite;
    }
    @keyframes scissors-ride {
      0%   { offset-distance: 0%;   }
      100% { offset-distance: 100%; }
    }

    .processing-label {
      font-family: var(--font-ui);
      font-size: var(--fs-md);
      font-weight: var(--fw-semi);
      color: var(--color-text-primary);
    }
    .processing-sub {
      font-size: var(--fs-sm);
      color: var(--color-text-secondary);
      text-align: center;
      margin-top: -16px;
    }

    /* ═══════════════════════════════════════
       STEP 3 — REVIEW
    ═══════════════════════════════════════ */
    #review-overlay {
      background: var(--color-bg);
      background-image: radial-gradient(circle, var(--color-dot) 1px, transparent 1px);
      background-size: 28px 28px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        calc(72px + env(safe-area-inset-top, 0px))
        var(--sp-2xl)
        calc(var(--sp-2xl) + env(safe-area-inset-bottom, 0px));
      gap: 0;
    }

    .review-img-wrap {
      width: 72%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: var(--sp-3xl);
    }
    .review-img-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: var(--sh-object);
      mix-blend-mode: multiply;
    }

    #name-input {
      width: 100%;
      font-family: var(--font-ui);
      font-size: var(--fs-xl);
      font-weight: var(--fw-semi);
      text-align: center;
      color: var(--color-text-primary);
      background: transparent; border: none;
      border-bottom: 2px solid var(--color-border-subtle);
      padding: 8px 4px 10px;
      outline: none;
      margin-bottom: var(--sp-3xl);
    }
    #name-input::placeholder { color: var(--color-text-tertiary); }
    #name-input:focus { border-bottom-color: var(--color-accent); }

    /* Entrance animations */
    @keyframes object-arrive {
      from { transform: scale(0.82) translateY(20px); opacity: 0; }
      to   { transform: scale(1)    translateY(0);    opacity: 1; }
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0);   }
    }

    #review-overlay.active .review-img-wrap {
      animation: object-arrive 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #review-overlay.active #name-input {
      animation: fade-up 0.3s ease 0.25s both;
    }
    #review-overlay.active .review-actions {
      animation: fade-up 0.3s ease 0.35s both;
    }

    /* Three-button review row */
    .review-actions {
      display: flex; align-items: center; justify-content: center;
      gap: var(--sp-2xl); width: 100%;
    }

    .review-btn {
      border: none; cursor: pointer; border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      transition: transform var(--tx-fast);
      background: var(--neutral-100);
      width: 56px; height: 56px;
      font-size: 20px; color: var(--neutral-800);
    }
    .review-btn:active { transform: scale(0.95); }

    #confirm-btn {
      width: 64px; height: 64px;
      background: var(--color-accent);
      font-size: 24px; color: #fff;
      box-shadow: var(--sh-fab);
    }
    #confirm-btn:active { transform: scale(0.93); }

    /* ═══════════════════════════════════════
       DETAIL VIEW
    ═══════════════════════════════════════ */
    #detail-overlay {
      background: var(--color-bg);
      background-image: radial-gradient(circle, var(--color-dot) 1px, transparent 1px);
      background-size: 28px 28px;
      flex-direction: column;
      align-items: center;
      padding:
        calc(72px + env(safe-area-inset-top, 0px))
        var(--sp-2xl)
        calc(var(--sp-2xl) + env(safe-area-inset-bottom, 0px));
    }

    .detail-img-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-img-wrap img {
      max-width: 78%;
      max-height: 60vh;
      object-fit: contain;
      filter:
        drop-shadow( 2px  0   0 #fff)
        drop-shadow(-2px  0   0 #fff)
        drop-shadow( 0    2px 0 #fff)
        drop-shadow( 0   -2px 0 #fff)
        drop-shadow( 1.5px  1.5px 0 #fff)
        drop-shadow(-1.5px  1.5px 0 #fff)
        drop-shadow( 1.5px -1.5px 0 #fff)
        drop-shadow(-1.5px -1.5px 0 #fff)
        drop-shadow(0 8px 24px rgba(0,0,0,0.14));
      mix-blend-mode: multiply;
    }

    .detail-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: var(--sp-xl);
      margin-bottom: var(--sp-3xl);
      width: 100%;
    }

    #detail-name {
      font-family: var(--font-object);
      font-size: var(--fs-xl);
      font-weight: var(--fw-bold);
      color: var(--color-text-primary);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: var(--r-sm);
      letter-spacing: -0.3px;
      text-align: center;
      line-height: 1.2;
      transition: background var(--tx-fast);
    }
    #detail-name:active { background: var(--color-border-subtle); }

    .detail-name-input {
      font-family: var(--font-object);
      font-size: var(--fs-xl);
      font-weight: var(--fw-bold);
      color: var(--color-text-primary);
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--color-accent);
      text-align: center;
      padding: 4px 8px;
      outline: none;
      max-width: 80%;
      letter-spacing: -0.3px;
    }

    #detail-date {
      font-size: var(--fs-xs);
      color: var(--color-text-tertiary);
      text-align: center;
    }

    .detail-footer {
      display: flex;
      justify-content: center;
    }

    #delete-btn {
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      font-weight: var(--fw-med);
      color: var(--neutral-500);
      background: transparent;
      border: 1.5px solid var(--color-border);
      border-radius: var(--r-pill);
      padding: 0 var(--sp-2xl);
      height: 40px;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--tx-base), color var(--tx-base), border-color var(--tx-base);
    }
    #delete-btn.confirming {
      background: #e53e3e;
      border-color: #e53e3e;
      color: #fff;
    }

    /* Detail entrance animations */
    #detail-overlay.active .detail-img-wrap {
      animation: object-arrive 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #detail-overlay.active .detail-info {
      animation: fade-up 0.3s ease 0.15s both;
    }
    #detail-overlay.active .detail-footer {
      animation: fade-up 0.3s ease 0.22s both;
    }

    /* Privacy note */
    .privacy-note {
      font-size: var(--fs-xs);
      color: var(--color-text-tertiary);
      text-align: center;
      margin-top: var(--sp-3xl);
    }
  </style>
</head>
<body>

<!-- HOME ─────────────────────────────────── -->
<main id="home">
  <header class="header">
    <h1 class="header__title">collectobjects</h1>
    <p class="header__count" id="header-count"></p>
  </header>
  <section class="grid" id="grid" aria-label="Object collection"></section>
  <p class="privacy-note">Stays on your phone — no accounts, no cloud.</p>
</main>

<button id="fab" aria-label="Capture new object">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 15.2C13.7673 15.2 15.2 13.7673 15.2 12C15.2 10.2327 13.7673 8.8 12 8.8C10.2327 8.8 8.8 10.2327 8.8 12C8.8 13.7673 10.2327 15.2 12 15.2Z" fill="white"/>
    <path d="M9 2L7.17 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4H16.83L15 2H9ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17Z" fill="white"/>
  </svg>
</button>

<!-- STEP 1 — CAMERA ──────────────────────── -->
<div id="camera-overlay" class="overlay" role="dialog" aria-label="Camera">
  <button class="btn-close" id="camera-close" aria-label="Close">✕</button>
  <video id="camera-video" autoplay playsinline muted></video>
  <div class="cam-denied" id="cam-denied">
    <span>📷</span>
    <span>Camera access denied.<br>Allow camera in browser settings and try again.</span>
  </div>
  <div class="cam-controls">
    <button id="shutter-btn" aria-label="Take photo"></button>
  </div>
</div>

<!-- STEP 2 — PROCESSING ──────────────────── -->
<div id="processing-overlay" class="overlay" role="status" aria-label="Removing background">
  <div class="cut-stage">
    <img id="proc-preview" class="cut-stage__img" src="" alt="" />
    <svg class="cut-stage__svg" viewBox="0 0 246 246" xmlns="http://www.w3.org/2000/svg">
      <path class="cut-trace"
        d="M22,12 L222,12 Q234,12 234,24 L234,222 Q234,234 222,234 L22,234 Q12,234 12,222 L12,24 Q12,12 22,12 Z" />
      <path class="cut-done"
        d="M22,12 L222,12 Q234,12 234,24 L234,222 Q234,234 222,234 L22,234 Q12,234 12,222 L12,24 Q12,12 22,12 Z" />
    </svg>
    <div class="cut-scissors">✂️</div>
  </div>
  <p class="processing-label">Cutting background…</p>
  <p class="processing-sub">Just a moment</p>
</div>

<!-- STEP 3 — REVIEW ──────────────────────── -->
<div id="review-overlay" class="overlay" role="dialog" aria-label="Review capture">
  <button class="btn-close" id="review-close" aria-label="Close">✕</button>
  <div class="review-img-wrap">
    <img id="review-img" src="" alt="Captured object" />
  </div>
  <input id="name-input" type="text" placeholder="Name this object…"
         maxlength="40" autocomplete="off" autocorrect="off"
         autocapitalize="words" spellcheck="false" />
  <div class="review-actions">
    <button class="review-btn" id="retake-btn" aria-label="Retake">↺</button>
    <button class="review-btn" id="confirm-btn" aria-label="Save">✓</button>
    <button class="review-btn" id="discard-btn" aria-label="Discard">✕</button>
  </div>
</div>

<!-- DETAIL VIEW ──────────────────────── -->
<div id="detail-overlay" class="overlay" role="dialog" aria-label="Object detail">
  <button class="btn-close" id="detail-close" aria-label="Close">✕</button>
  <div class="detail-img-wrap">
    <img id="detail-img" src="" alt="" />
  </div>
  <div class="detail-info">
    <button class="detail-name" id="detail-name"></button>
    <p class="detail-date" id="detail-date"></p>
  </div>
  <div class="detail-footer">
    <button id="delete-btn">Delete</button>
  </div>
</div>

<canvas id="capture-canvas" style="display:none"></canvas>

<script type="module">
import { removeBackground as imglyRemoveBg } from '@imgly/background-removal';

/* ════════════════════════════════════════════════
   STORAGE
════════════════════════════════════════════════ */
const STORAGE_KEY = 'memories_collection';

function loadMemories() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveMemories(arr) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }
  catch (e) { console.warn('localStorage full:', e); }
}

/* ════════════════════════════════════════════════
   DATE HELPERS
════════════════════════════════════════════════ */
const fmtFull = d => d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });

/* ════════════════════════════════════════════════
   SEED DATA
════════════════════════════════════════════════ */
function buildSeed() {
  const daysAgo = n => { const d = new Date(); d.setDate(d.getDate()-n); return fmtFull(d); };
  return [
    { id:1, name:'Vintage Key',  date:daysAgo(8),  image:'assets/key.png' },
    { id:2, name:'Blue Teapot',  date:daysAgo(10), image:'assets/teapot.png' },
    { id:3, name:'Croissant',    date:daysAgo(13), image:'assets/croissant.png' },
    { id:4, name:'Rubber Duck',  date:daysAgo(16), image:'assets/duck.png' },
  ];
}

function getMemories() {
  const stored = loadMemories();
  return stored.length ? stored : buildSeed();
}

/* ════════════════════════════════════════════════
   RENDER GRID
════════════════════════════════════════════════ */
function renderGrid() {
  const memories = getMemories().slice().reverse();
  const count = memories.length;

  document.getElementById('header-count').textContent =
    `${count} object${count !== 1 ? 's' : ''}`;

  document.getElementById('grid').innerHTML = memories.map(m => `
    <div class="card" role="button" tabindex="0" aria-label="${esc(m.name)}" data-id="${m.id}">
      <div class="card__img-wrap">
        <img src="${m.image}" alt="${esc(m.name)}" loading="lazy" decoding="async" />
      </div>
      <p class="card__name">${esc(m.name)}</p>
      <p class="card__date">${m.date}</p>
    </div>
  `).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ════════════════════════════════════════════════
   OVERLAY HELPERS
════════════════════════════════════════════════ */
function showOverlay(id) {
  document.getElementById(id).classList.add('active');
  document.getElementById('fab').style.display = 'none';
}
function hideOverlay(id) {
  document.getElementById(id).classList.remove('active');
}
function hideAll() {
  ['camera-overlay','processing-overlay','review-overlay','detail-overlay'].forEach(hideOverlay);
  document.getElementById('fab').style.display = 'flex';
}

/* ════════════════════════════════════════════════
   STEP 1 — CAMERA
════════════════════════════════════════════════ */
let stream = null;

async function openCamera() {
  const video  = document.getElementById('camera-video');
  const denied = document.getElementById('cam-denied');

  showOverlay('camera-overlay');
  denied.classList.remove('visible');
  video.style.display = 'block';

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal:'environment' }, width:{ideal:1920}, height:{ideal:1920} },
      audio: false,
    });
    video.srcObject = stream;
  } catch (err) {
    console.warn('[camera]', err.name);
    video.style.display = 'none';
    denied.classList.add('visible');
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('camera-video').srcObject = null;
}

function captureFrame() {
  const video  = document.getElementById('camera-video');
  const canvas = document.getElementById('capture-canvas');
  const vw = video.videoWidth  || 1280;
  const vh = video.videoHeight || 1280;
  const side = Math.min(vw, vh);
  canvas.width = canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, (vw-side)/2, (vh-side)/2, side, side, -1024, 0, 1024, 1024);
  ctx.restore();
  return canvas.toDataURL('image/jpeg', 0.92);
}

/* ════════════════════════════════════════════════
   STEP 2 — BACKGROUND REMOVAL
   Client-side ML via @imgly/background-removal.
   Runs in browser, no API key, photos never leave
   device. First use downloads model (~20MB, cached).
════════════════════════════════════════════════ */
let _bgModelReady = false;

async function removeBackground(jpegDataURL) {
  if (!_bgModelReady) {
    document.querySelector('.processing-sub').textContent = 'Downloading cutout engine…';
  }

  const res = await fetch(jpegDataURL);
  const blob = await res.blob();

  const result = await imglyRemoveBg(blob, {
    publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/',
  });

  _bgModelReady = true;
  document.querySelector('.processing-sub').textContent = 'Just a moment';
  return result;
}

/* ════════════════════════════════════════════════
   STEP 3 — REVIEW
════════════════════════════════════════════════ */
let _pendingBlob = null;

function showReview(blob) {
  if (_pendingBlob instanceof Blob) {
    const url = document.getElementById('review-img').src;
    if (url.startsWith('blob:')) URL.revokeObjectURL(url);
  }
  _pendingBlob = blob;

  document.getElementById('review-img').src = URL.createObjectURL(blob);
  document.getElementById('name-input').value = '';

  hideOverlay('processing-overlay');
  showOverlay('review-overlay');
}

/* ════════════════════════════════════════════════
   STEP 4 — SAVE
════════════════════════════════════════════════ */
async function saveMemory() {
  const name = document.getElementById('name-input').value.trim() || 'My Object';
  if (!_pendingBlob) return;

  const reader = new FileReader();
  reader.onload = () => {
    const memories = getMemories();
    memories.push({
      id:    Date.now(),
      name:  name,
      date:  fmtFull(new Date()),
      image: reader.result,
    });
    saveMemories(memories);
    _pendingBlob = null;
    hideAll();
    renderGrid();
  };
  reader.readAsDataURL(_pendingBlob);
}

/* ════════════════════════════════════════════════
   FULL FLOW
════════════════════════════════════════════════ */
async function onShutterPressed() {
  if (!stream) return;

  const jpegDataURL = captureFrame();
  stopCamera();
  hideOverlay('camera-overlay');

  document.getElementById('proc-preview').src = jpegDataURL;
  showOverlay('processing-overlay');

  // Minimum display time so the scissors completes one full loop.
  // With real bg-removal, waits for whichever takes longer.
  const MIN_MS = 2800;
  const t0 = Date.now();

  try {
    const blob = await removeBackground(jpegDataURL);
    const remaining = MIN_MS - (Date.now() - t0);
    if (remaining > 0) await new Promise(r => setTimeout(r, remaining));
    showReview(blob);
  } catch (err) {
    console.error('[bg-removal]', err.message || err);
    const res = await fetch(jpegDataURL);
    const fallbackBlob = await res.blob();
    const remaining = MIN_MS - (Date.now() - t0);
    if (remaining > 0) await new Promise(r => setTimeout(r, remaining));
    showReview(fallbackBlob);
  }
}

/* ════════════════════════════════════════════════
   EVENTS
════════════════════════════════════════════════ */
document.getElementById('fab').addEventListener('click', openCamera);
document.getElementById('camera-close').addEventListener('click', () => { stopCamera(); hideAll(); });
document.getElementById('shutter-btn').addEventListener('click', onShutterPressed);
document.getElementById('review-close').addEventListener('click', hideAll);

document.getElementById('retake-btn').addEventListener('click', () => {
  hideOverlay('review-overlay');
  openCamera();
});

document.getElementById('confirm-btn').addEventListener('click', saveMemory);
document.getElementById('discard-btn').addEventListener('click', hideAll);

document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); saveMemory(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { stopCamera(); hideAll(); }
});

/* ════════════════════════════════════════════════
   DETAIL VIEW
════════════════════════════════════════════════ */
let _detailId = null;
let _deleteTimer = null;

function openDetail(idStr) {
  const memories = getMemories();
  const mem = memories.find(m => String(m.id) === String(idStr));
  if (!mem) return;

  _detailId = idStr;

  const img = document.getElementById('detail-img');
  img.src = mem.image;
  img.alt = mem.name;

  const nameBtn = document.getElementById('detail-name');
  nameBtn.textContent = mem.name;
  nameBtn.style.display = '';

  const existingInput = document.getElementById('detail-name-input');
  if (existingInput) existingInput.remove();

  document.getElementById('detail-date').textContent = mem.date;
  resetDeleteBtn();
  showOverlay('detail-overlay');
}

function resetDeleteBtn() {
  const btn = document.getElementById('delete-btn');
  btn.classList.remove('confirming');
  btn.textContent = 'Delete';
  if (_deleteTimer) { clearTimeout(_deleteTimer); _deleteTimer = null; }
}

function startRename() {
  const nameBtn = document.getElementById('detail-name');
  const currentName = nameBtn.textContent;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'detail-name-input';
  input.id = 'detail-name-input';
  input.value = currentName;
  input.maxLength = 40;
  input.setAttribute('autocomplete', 'off');
  input.setAttribute('autocorrect', 'off');
  input.setAttribute('autocapitalize', 'words');
  input.setAttribute('spellcheck', 'false');

  nameBtn.style.display = 'none';
  nameBtn.parentNode.insertBefore(input, nameBtn);
  input.focus();
  input.select();

  let committed = false;

  function commit() {
    if (committed) return;
    committed = true;
    const newName = input.value.trim() || currentName;
    const memories = getMemories();
    const idx = memories.findIndex(m => String(m.id) === String(_detailId));
    if (idx !== -1) {
      memories[idx].name = newName;
      saveMemories(memories);
    }
    nameBtn.textContent = newName;
    nameBtn.style.display = '';
    input.remove();
    renderGrid();
  }

  function cancel() {
    committed = true;
    nameBtn.style.display = '';
    input.remove();
  }

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') {
      e.preventDefault();
      input.removeEventListener('blur', commit);
      cancel();
    }
  });
}

document.getElementById('detail-close').addEventListener('click', () => {
  resetDeleteBtn();
  hideAll();
});

document.getElementById('detail-name').addEventListener('click', startRename);

document.getElementById('delete-btn').addEventListener('click', () => {
  const btn = document.getElementById('delete-btn');
  if (!btn.classList.contains('confirming')) {
    btn.classList.add('confirming');
    btn.textContent = 'Sure? Tap to delete';
    _deleteTimer = setTimeout(resetDeleteBtn, 3000);
  } else {
    clearTimeout(_deleteTimer);
    _deleteTimer = null;
    const remaining = getMemories().filter(m => String(m.id) !== String(_detailId));
    saveMemories(remaining);
    hideAll();
    renderGrid();
  }
});

document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openDetail(card.dataset.id);
});

document.getElementById('grid').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest('.card');
    if (card) { e.preventDefault(); openDetail(card.dataset.id); }
  }
});

/* ════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════ */
renderGrid();
</script>
</body>
</html>
