<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edecea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Memories</title>
  <!-- Nunito ExtraBold (800) — for object name labels -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet" />
  <style>
    /* ── Layer 1: Design Tokens ──────────────────────────────────── */
    :root {
      --color-bg:             #edecea;
      --color-dot:            #ccc8c2;
      --color-text-primary:   #111111;
      --color-text-secondary: #888888;
      --color-text-tertiary:  #bbbbbb;
      --color-accent:         #f5a742;
      --color-accent-glow:    rgba(245,167,66,0.30);

      --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-display: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      --fs-xs:    11px;
      --fs-sm:    13px;
      --fs-base:  14px;
      --fs-md:    15px;
      --fs-xl:    28px;
      --fw-reg:   400;
      --fw-semi:  600;
      --fw-bold:  800;

      --sp-sm:   8px;
      --sp-md:   12px;
      --sp-lg:   16px;
      --sp-xl:   20px;
      --sp-2xl:  24px;
      --sp-3xl:  32px;

      --r-md:    20px;
      --r-full:  50%;

      --sh-object: drop-shadow(0 6px 18px rgba(0,0,0,0.14));
      --sh-fab:    0 6px 20px rgba(245,167,66,0.35);

      --tx-base: 0.2s ease;
    }

    /* ── Reset ───────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body { height: 100%; }

    /* ── Base ────────────────────────────────────────────────────── */
    body {
      font-family: var(--font);
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      overflow: hidden;
      /* Mobile-first: cap width so it never exceeds a phone screen */
      max-width: 430px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Dot texture ─────────────────────────────────────────────── */
    #dots {
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle, var(--color-dot) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════════════════
       HOME / GRID
    ═══════════════════════════════════════════════════════════════ */
    #home {
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      bottom: 0;
      z-index: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        calc(var(--sp-2xl) + env(safe-area-inset-top,    0px))
        calc(var(--sp-lg)  + env(safe-area-inset-right,  0px))
        calc(90px          + env(safe-area-inset-bottom, 0px))
        calc(var(--sp-lg)  + env(safe-area-inset-left,   0px));
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .header {
      margin-bottom: var(--sp-3xl);
    }
    .header__date {
      font-size: var(--fs-sm);
      font-weight: var(--fw-reg);
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }
    .header__title {
      font-size: var(--fs-xl);
      font-weight: var(--fw-reg);
      letter-spacing: -0.5px;
      color: var(--color-text-primary);
      line-height: 1.15;
    }
    .header__count {
      font-size: var(--fs-sm);
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    /* ── Grid ────────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: var(--sp-lg);
      row-gap: var(--sp-3xl);   /* generous vertical gap — breathing room */
    }

    /* ── Memory Card ─────────────────────────────────────────────── */
    /*
     * NO card container. Objects float directly on the grey bg.
     * mix-blend-mode: multiply makes white photo backgrounds
     * disappear against the grey — same trick as CapWords.
     */
    .card {
      cursor: pointer;
      user-select: none;
      transition: transform var(--tx-base);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card:active { transform: scale(0.97); }

    .card__img-wrap {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card__img-wrap img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      filter: var(--sh-object);
      mix-blend-mode: multiply;   /* white bg → transparent on grey */
    }

    .card__name {
      font-family: var(--font-display);   /* Nunito ExtraBold */
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);        /* 800 */
      letter-spacing: -0.2px;
      color: var(--color-text-primary);
      text-align: center;
      margin-top: var(--sp-sm);
      line-height: 1.2;
    }
    .card__date {
      font-size: var(--fs-xs);
      font-weight: var(--fw-reg);
      color: var(--color-text-tertiary);
      text-align: center;
      margin-top: 4px;
    }

    /* ── FAB ─────────────────────────────────────────────────────── */
    #fab {
      position: fixed;
      bottom: calc(var(--sp-2xl) + env(safe-area-inset-bottom, 0px));
      /* Keep FAB inside the 430px mobile column */
      right: max(calc(var(--sp-xl) + env(safe-area-inset-right, 0px)),
                 calc(50vw - 215px + var(--sp-xl)));
      width: 58px; height: 58px;
      border-radius: var(--r-full);
      background: var(--color-accent);
      box-shadow: var(--sh-fab);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: var(--fw-semi); color: #fff;
      z-index: 50;
      transition: transform var(--tx-base);
      user-select: none;
    }
    #fab:active { transform: scale(0.95); }
  </style>
</head>
<body>

<div id="dots" aria-hidden="true"></div>

<!-- ═══════════════════════════════════════════════════════════════
     HOME SCREEN
═══════════════════════════════════════════════════════════════ -->
<main id="home">

  <header class="header">
    <p class="header__date" id="header-date"></p>
    <h1 class="header__title">Memories</h1>
    <p class="header__count" id="header-count"></p>
  </header>

  <section class="grid" id="grid" aria-label="Memory collection">

    <div class="card" role="button" tabindex="0" aria-label="Vintage Key">
      <div class="card__img-wrap">
        <img src="assets/key.png" alt="Vintage Key" loading="eager" decoding="async" />
      </div>
      <p class="card__name">Vintage Key</p>
      <p class="card__date" id="date-key"></p>
    </div>

    <div class="card" role="button" tabindex="0" aria-label="Blue Teapot">
      <div class="card__img-wrap">
        <img src="assets/teapot.png" alt="Blue Teapot" loading="eager" decoding="async" />
      </div>
      <p class="card__name">Blue Teapot</p>
      <p class="card__date" id="date-teapot"></p>
    </div>

    <div class="card" role="button" tabindex="0" aria-label="Croissant">
      <div class="card__img-wrap">
        <img src="assets/croissant.png" alt="Croissant" loading="eager" decoding="async" />
      </div>
      <p class="card__name">Croissant</p>
      <p class="card__date" id="date-croissant"></p>
    </div>

    <div class="card" role="button" tabindex="0" aria-label="Rubber Duck">
      <div class="card__img-wrap">
        <img src="assets/duck.png" alt="Rubber Duck" loading="eager" decoding="async" />
      </div>
      <p class="card__name">Rubber Duck</p>
      <p class="card__date" id="date-duck"></p>
    </div>

  </section>
</main>

<button id="fab" aria-label="Add new memory">+</button>

<script>
  // ── Date helpers ────────────────────────────────────────────────
  function fmtShort(d) {
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  }
  function fmtFull(d) {
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  const today = new Date();

  document.getElementById('header-date').textContent  = fmtShort(today);
  document.getElementById('header-count').textContent = '4 objects collected';

  // Sample dates — spaced back from today
  const dates = [
    new Date(today - 3 * 86400000),
    new Date(today - 5 * 86400000),
    new Date(today - 8 * 86400000),
    new Date(today - 11 * 86400000),
  ];

  document.getElementById('date-key').textContent       = fmtFull(dates[0]);
  document.getElementById('date-teapot').textContent    = fmtFull(dates[1]);
  document.getElementById('date-croissant').textContent = fmtFull(dates[2]);
  document.getElementById('date-duck').textContent      = fmtFull(dates[3]);
</script>
</body>
</html>
